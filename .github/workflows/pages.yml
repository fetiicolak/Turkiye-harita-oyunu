name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: Node.js'i hazırla
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Chromium'u hazırla
        run: npx playwright install --with-deps chromium

      - name: Statik ve tarayıcı testlerini çalıştır
        run: npm test

      - name: GitHub Pages'i hazırla
        uses: actions/configure-pages@v5

      - name: Site dosyalarını yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
